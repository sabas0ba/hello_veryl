name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  veryl:
    runs-on: ubuntu-latest
    container:
      # veryllang/veryl:0.20.2 (Debian trixie, multi-arch index digest)
      image: veryllang/veryl@sha256:147ca873b012cb0c0ba00f5a19f7f2f58a7fdd6400c5f823bb78bf23f2100ac9
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build and test
        run: bash ./scripts/ci.sh

  # 合成後検査 (verif/): FPGA ツールチェーンを要するため，ローカルと同一の
  # pin 済みコンテナ (container/Containerfile) をビルドして実行する
  verif:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build toolchain container
        run: docker build -t hello-veryl-fpga -f container/Containerfile container
      - name: Run verification suite
        run: docker run --rm --network none -v "$PWD:/work" hello-veryl-fpga bash verif/run.sh
